name: Flaky e2e reproduction

on:
  pull_request:
    branches:
      - main

jobs:
  e2e-reproduction:
    name: e2e reproduction (attempt ${{ matrix.attempt }})
    strategy:
      fail-fast: false
      matrix:
        attempt: [1]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node packages/build/src/computeNodeModulesCacheKey.ts)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
          restore-keys: ${{ runner.os }}-cacheNodeModules-
      - name: npm ci
        run: npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'
      - name: Patch renderer-process message capture
        run: node packages/server/postinstall.ts
      - name: Rebuild diagnostics
        run: npm run build
      - name: Install Chromium and system dependencies
        working-directory: ./packages/test-with-playwright-worker
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Run sample.hello-world
        working-directory: ./packages/e2e
        run: npm run e2e -- --runTestsByPath test/sample.hello-world.test.ts --testTimeout=60000
        env:
          E2E_DIAGNOSTIC_ATTEMPT: ${{ matrix.attempt }}
          E2E_DIAGNOSTIC_DIR: ${{ github.workspace }}/.e2e-artifacts
          PLAYWRIGHT_BROWSERS_PATH: 0
          TEST_WITH_PLAYWRIGHT_BROWSER: chromium
      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-attempt-${{ matrix.attempt }}
          path: |
            .e2e-artifacts/**
            .test-with-playwright
            packages/e2e/fixtures/sample.hello-world/e2e/coverage
            packages/e2e/fixtures/sample.hello-world/e2e/*.svg
          if-no-files-found: ignore
